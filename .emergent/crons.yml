crons:
  - name: weekly-enquiry-digest
    description: "Emails info@goalfinity.co a summary of last week's enquiries by page and vertical, Mondays 9am IST"
    cron: "0 9 * * 1"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/weekly-digest"
    method: POST
    enabled: true
  - name: followup-reminders
    description: "Emails info@goalfinity.co a list of enquiries still marked new after 2 days, daily 10am IST"
    cron: "0 10 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/followup-reminders"
    method: POST
    enabled: true
